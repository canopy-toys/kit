# The toy workspace's map. Install with ./toys.py install, which copies it to ~/canopy-toys/workspace.

[workspace]
name = "canopy-toys"

[repos.toy-calc]
url = "https://github.com/canopy-toys/toy-calc.git"
summary = "A tiny stdlib Python CLI calculator: ops, format, and cli modules, unittest tests, a CHANGELOG."

[tracker]
provider = "github"
needs_human_label = "needs-human"
query = "repo:canopy-toys/toy-calc is:issue is:open"

[trust]
branch_prefix = "agent/"

[policy]
# Short, so S9 reaches its attempt limit in minutes rather than an hour.
fix_ci_cooldown_minutes = 5

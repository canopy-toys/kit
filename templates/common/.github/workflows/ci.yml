name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python: no setup-python, nothing to install.
      - run: python3 -m unittest -v
      - run: python3 ci/fetch_check.py
        env:
          TOY_FETCH_URL: ${{ vars.TOY_FETCH_URL }}
      - run: python3 ci/branch_check.py
        env:
          TOY_FAIL_BRANCH: ${{ vars.TOY_FAIL_BRANCH }}
